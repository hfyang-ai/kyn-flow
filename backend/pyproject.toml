[project]
name = "kynflow"
version = "0.1.0"
description = "Kynflow backend - GitHub PR/Issue collaboration AI agent (FastAPI)"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "pydantic==2.10.4",
    "pydantic-settings>=2.10.1,<3.0.0",
    "sqlalchemy==2.0.36",
    "psycopg[binary]==3.2.3",
    "pgvector==0.3.6",
    "pymilvus>=2.5.0",
    "alembic==1.14.0",
    "httpx==0.28.1",
    "langchain==1.2.17",
    "langchain-community==0.4.1",
    "langgraph==1.1.10",
    "langchain-openai==1.2.1",
    "ragas==0.4.3",
    "openai==2.53.0",
    "datasets>=3.0.0",
    "python-dotenv==1.0.1",
    "pyyaml==6.0.3",
    "cryptography==44.0.0",
    "python-multipart==0.0.20",
    "pypdf>=5.1.0",
    "python-docx>=1.1.2",
]

[dependency-groups]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.25.0",
]
local-embedding = [
    "sentence-transformers>=5.0.0",
]

[tool.uv]
# 应用项目（非可发布库），只管理依赖、不构建/安装项目本体
package = false

[tool.pytest.ini_options]
# app 是隐式命名空间包，需把 backend 根目录加入 sys.path（等价于原 `python -m pytest`）
pythonpath = ["."]
testpaths = ["app/tests"]

