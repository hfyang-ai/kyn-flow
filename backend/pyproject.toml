[project]
name = "kynflow"
version = "0.1.0"
description = "Kynflow backend - GitHub PR/Issue collaboration AI agent (FastAPI)"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "pydantic==2.10.4",
    "pydantic-settings>=2.10.1,<3.0.0",
    "sqlalchemy==2.0.36",
    "psycopg[binary]==3.2.3",
    "pgvector==0.3.6",
    "pymilvus>=2.5.0",
    "alembic==1.14.0",
    "httpx==0.28.1",
    "langchain==1.2.17",
    "langchain-community==0.4.1",
    "langgraph==1.1.10",
    "langchain-openai==1.2.1",
    "ragas==0.4.3",
    "openai==2.53.0",
    "datasets>=3.0.0",
    "python-dotenv==1.0.1",
    "pyyaml==6.0.3",
    "cryptography==44.0.0",
    "python-multipart==0.0.20",
    "pypdf>=5.1.0",
    "python-docx>=1.1.2",
    "tree-sitter>=0.26.0",
    "tree-sitter-python>=0.25.0",
    "tree-sitter-javascript>=0.25.0",
    "tree-sitter-typescript>=0.23.2",
    "tree-sitter-c>=0.24.2",
    "tree-sitter-cpp>=0.23.4",
    "tree-sitter-c-sharp>=0.23.5",
    "tree-sitter-php>=0.25.1",
    "tree-sitter-ruby>=0.23.1",
    "tree-sitter-scala>=0.26.4",
    "tree-sitter-sql>=0.3.11",
    "tree-sitter-bash>=0.25.1",
    "tree-sitter-powershell>=0.26.4",
    "sentence-transformers>=6.2.0",
]

[dependency-groups]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.25.0",
    "ruff>=0.17.2",
]
local-embedding = [
    "sentence-transformers>=5.0.0",
]

[tool.uv]
# 应用项目（非可发布库），只管理依赖、不构建/安装项目本体
package = false

[tool.pytest.ini_options]
# app 是隐式命名空间包，需把 backend 根目录加入 sys.path（等价于原 `python -m pytest`）
pythonpath = ["."]
testpaths = ["app/tests"]
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
ignore = [
    "B008",   # FastAPI 依赖注入（Depends/Query/require_permission）只能写在参数默认值里
    "BLE001", # agent 代码刻意的 defensive fallback（LLM/工具失败兜底降级）
    "RUF012", # BaseAgent.available_tools 是只读工具清单（声明式类属性，非可变状态）
    "TRY004", # 配置文件/评测集数据校验抛 ValueError 是正确语义（非 API 参数类型错误）
]


